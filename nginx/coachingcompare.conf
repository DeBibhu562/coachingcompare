# Upstream to CoachingCompare Next.js container or local port
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

# -------------------------------------------------------------
# HTTP Server (Port 80) - Handles Let's Encrypt and redirects to HTTPS
# -------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name coachingcompare.in www.coachingcompare.in;

    # Allow Let's Encrypt / Certbot renewal challenges
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# -------------------------------------------------------------
# HTTPS Server (Port 443) - SSL & Reverse Proxy
# (Enable after obtaining your SSL cert via certbot --nginx)
# -------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coachingcompare.in www.coachingcompare.in;

    # SSL Certificates (managed by Certbot)
    ssl_certificate /etc/letsencrypt/live/coachingcompare.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coachingcompare.in/privkey.pem;

    # Recommended SSL settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip Compression for maximum speed
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Next.js Static Asset Caching (Immutable files with hash)
    location /_next/static/ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public static files (SVGs, icons, images)
    location ~* \.(ico|svg|png|jpg|jpeg|webp|gif|woff|woff2|ttf|eot)$ {
        proxy_pass http://nextjs_upstream;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # Reverse Proxy to Next.js App
    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
