services:
  coachingcompare:
    container_name: coachingcompare
    # SAFETY: serve the frozen production image. Do NOT enable build
    # until source parity is verified (see SAFETY.md).
    image: coachingcompare:frozen-latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:3020:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - default
      - coaching-platform_web

networks:
  coaching-platform_web:
    external: true
