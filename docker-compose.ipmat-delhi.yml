# Preview / path-split service for IPMAT Delhi ranking pages.
# Keeps the live `coachingcompare` container intact (see IMPORTANT_SOURCE_NOTE.md).
services:
  coachingcompare-ipmat-delhi:
    container_name: coachingcompare-ipmat-delhi
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    networks:
      - default
      - coaching-platform_web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/best-ipmat-coaching-in-delhi || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  coaching-platform_web:
    external: true
